# FerriteCore optimizado para Credipt SMP
# Con 150+ mods la deduplicación de memoria es crítica

# Mapa compacto de blockstates — levemente más lento pero ahorra RAM
# Con tantos mods modded vale la pena
compactFastMap = true

# Threading detector pequeño — riesgo muy bajo con C2ME ya instalado
useSmallThreadingDetector = false

# Cache de predicados multipart — ahorra RAM con Connected Glass y otros mods
cacheMultipartPredicates = true

# Deduplicación de MultipartBakedModel — ahorra RAM con mods con muchos blockstates
multipartDeduplication = true

# Deduplicación de cache de blockstates — una de las más importantes
blockstateCacheDeduplication = true

# Evita crear nuevos strings para ModelResourceLocations
modelResourceLocations = true

# Estructuras de datos más pequeñas para modelos simples
modelSides = true

# Reemplaza tabla de vecinos de blockstates
replaceNeighborLookup = true

# No popular tabla de vecinos — ahorra RAM (los mods raramente la acceden directo)
populateNeighborTable = false

# Reemplaza mapa de propiedades — requiere replaceNeighborLookup
replacePropertyMap = true

# Deduplicación de vértices en baked quads — ahorra RAM de render
bakedQuadDeduplication = true

# Ahorra overhead de data component maps vacíos
dataComponentPatch = true
