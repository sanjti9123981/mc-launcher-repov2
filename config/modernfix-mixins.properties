# ModernFix optimizado para Credipt SMP
# NeoForge 1.21.1 — Modpack pesado

# Carga recursos dinámicamente en vez de todos al inicio
# Reduce tiempo de carga y uso de RAM significativamente
mixin.perf.dynamic_resources=true
mixin.perf.dynamic_resources.ctm=true
mixin.perf.dynamic_resources.ldlib=true

# Renderizado de entidades dinámico — no carga renders de mobs no vistos
mixin.perf.dynamic_entity_renderers=true

# Deduplicación de parámetros de clima — ahorra RAM con muchas dimensiones
mixin.perf.deduplicate_climate_parameters=true
mixin.perf.deduplicate_location=true

# Renderizado de items más rápido
mixin.perf.faster_item_rendering=true

# Deduplicación de ingredientes en recetas — útil con Create y KubeJS
mixin.perf.ingredient_item_deduplication=true

# Limpia info de mixins después de cargar — libera RAM
mixin.perf.clear_mixin_classinfo=true

# Desactivar telemetría de Mojang
mixin.feature.remove_telemetry=true
