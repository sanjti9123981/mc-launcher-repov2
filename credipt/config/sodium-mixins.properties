# Sodium optimizado para Credipt SMP
# NeoForge 1.21.1 con Create y mods de render

# Chunk rendering optimizations
mixin.features.chunk_rendering=true

# Entity rendering — mejora FPS con muchos mobs modded
mixin.features.entity_rendering=true

# Options screen
mixin.features.options=true

# Reduce re-renders de chunks innecesarios
mixin.features.block_rendering=true
